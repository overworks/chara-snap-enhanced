<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chara Snap — Free SillyTavern Character Card Editor | V2, V3, CHARX</title>
    <meta
      name="description"
      content="Free client-side character card editor for SillyTavern, RisuAI, and Agnai. Edit V2 PNG cards with depth_prompt, lorebook, alternate greetings — no uploads, no account needed."
    />
    <meta
      name="keywords"
      content="SillyTavern character card editor, tavern card editor, AI character card editor, character card maker, depth_prompt editor, lorebook editor SillyTavern, CHARX editor, V2 character card, V3 character card"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chara Snap — Free SillyTavern Character Card Editor" />
    <meta
      property="og:description"
      content="Free client-side character card editor for SillyTavern, RisuAI, and Agnai. No uploads, no account needed."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Apply the saved theme + language before paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("chara-snap-theme") || "system";
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
          var l = localStorage.getItem("chara-snap-locale");
          if (!l) {
            l = (navigator.language || "en").toLowerCase().startsWith("ko")
              ? "ko"
              : "en";
          }
          document.documentElement.lang = l;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
